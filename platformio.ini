; =============================================================================
; PIRUS - Boeuf-N-Gus - Configuration PlatformIO
;
; Un environnement = un programme a televerser.
;   complet      : le robot (src/main.cpp)                       <- par defaut
;   complet_debug: le robot, avec les logs detailles (moniteur a 115200)
;   simulation   : le robot, tous les modules en stub (sur la table)
;   test_xxx     : un module seul (src/tests/test_xxx.cpp remplace main.cpp)
;
; Dans VS Code : barre du bas, bouton "env:..." pour choisir.
; =============================================================================

[platformio]
build_dir = build
libdeps_dir = build/piolibdeps
default_envs = complet

; ---- Reglages communs, herites par tous les environnements ------------------
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+   ; trouve SPI.h et Wire.h dont Adafruit BusIO a besoin
; LibRobUS est deja copiee dans lib/LibRobUS : pas besoin de la telecharger.
lib_deps =
    SPI
    Wire
    adafruit/Adafruit TCS34725@^1.4.4
build_src_filter = +<*> -<tests/>
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; ---- Robot complet -----------------------------------------------------------
; Stubs : ceux de config.h (vrai materiel des qu'il est pret).
[env:complet]

[env:simulation]
build_flags =
    -D STUB_COULEUR=1
    -D STUB_SUIVEUR=1
    -D STUB_COMMANDE=1
    -D STUB_INGREDIENTS=1
    -D STUB_DEL=1

; ---- Un module seul ----------------------------------------------------------
; Pour ajouter le tien : copier un bloc, et creer src/tests/test_<module>.cpp
; (modele : src/tests/test_arret.cpp).
[env:test_arret]
build_src_filter = ${env.build_src_filter} -<main.cpp> +<tests/test_arret.cpp>

[env:test_couleur]
build_src_filter = ${env.build_src_filter} -<main.cpp> +<tests/test_couleur.cpp>

; Suiveur de ligne seul : bumpers AVANT / ARRIERE / GAUCHE (arret).
[env:test_suiveur]
build_src_filter = ${env.build_src_filter} -<main.cpp> +<tests/test_suiveur.cpp>

; Comme complet, avec les logs detailles : capteurs de couleur et de ligne,
; moteurs, decisions. Arret de 2 s a chaque station pour bien le voir.
[env:complet_debug]
build_flags =
    -D LOG_DEBUG=1
    -D DUREE_ARRET=2000UL
monitor_speed = 115200

; Vrai capteur + arret_robot, sans moteurs : passer des couleurs a la main.
[env:test_stations]
build_src_filter = ${env.build_src_filter} -<main.cpp> +<tests/test_stations.cpp>
